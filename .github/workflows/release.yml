name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PLUGIN_NAME: terrain_server
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache

permissions:
  contents: write

jobs:
  build-release:
    name: 📦 Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: ${{ matrix.platform }}-${{ matrix.arch }}-release-${{ hashFiles('godot-cpp/**') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-release-

      - name: Build Release Binary
        env:
          SCONS_CACHE: ${{ env.SCONS_CACHE }}
        run: |
          scons platform=${{ matrix.platform }} target=template_release arch=${{ matrix.arch }} -j2

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: demo/addons/${{ env.PLUGIN_NAME }}/bin/*
          retention-days: 1

  package-and-publish:
    name: 🎁 Package & Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*

      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release Package
        run: |
          mkdir -p release/addons/${{ env.PLUGIN_NAME }}/bin

          # Copy binaries from all platforms
          find artifacts -type f \( -name "*.so" -o -name "*.dll" \) -exec cp {} release/addons/${{ env.PLUGIN_NAME }}/bin/ \;
          find artifacts -type d -name "*.framework" -exec cp -r {} release/addons/${{ env.PLUGIN_NAME }}/bin/ \;

          # Create .gdextension with only release entries
          cat > release/addons/${{ env.PLUGIN_NAME }}/terrain_server.gdextension << 'EOF'
          [configuration]
          entry_symbol = "terrain_server_library_init"
          compatibility_minimum = "4.2"

          [libraries]
          linux.release.x86_64 = "res://addons/terrain_server/bin/libterrain_server.linux.template_release.x86_64.so"
          windows.release.x86_64 = "res://addons/terrain_server/bin/libterrain_server.windows.template_release.x86_64.dll"
          macos.release = "res://addons/terrain_server/bin/libterrain_server.macos.template_release.framework"
          EOF

          # Copy and update plugin.cfg with new version
          cp demo/addons/${{ env.PLUGIN_NAME }}/plugin.cfg release/addons/${{ env.PLUGIN_NAME }}/plugin.cfg
          sed -i 's/^version=.*/version="${{ steps.version.outputs.VERSION }}"/' release/addons/${{ env.PLUGIN_NAME }}/plugin.cfg

          # Copy and update README.md with new version
          cp demo/addons/${{ env.PLUGIN_NAME }}/README.md release/README.md
          sed -i 's/Terrain Server vX/Terrain Server v${{ steps.version.outputs.VERSION }}/' release/README.md
          sed -i 's/\${{ env.PLUGIN_NAME }}-v\${{ steps.version.outputs.VERSION }}/${{ env.PLUGIN_NAME }}-v${{ steps.version.outputs.VERSION }}/' release/README.md

      - name: Create ZIP
        run: |
          cd release
          zip -r ../${{ env.PLUGIN_NAME }}-v${{ steps.version.outputs.VERSION }}.zip .
          cd ..
          ls -lh ${{ env.PLUGIN_NAME }}-v${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PLUGIN_NAME }}-v${{ steps.version.outputs.VERSION }}.zip
          body: |
            ## Terrain Server v${{ steps.version.outputs.VERSION }}

            ### Installation
            Extract `${{ env.PLUGIN_NAME }}-v${{ steps.version.outputs.VERSION }}.zip` to project root, restart Godot, enable in **Project > Project Settings > Plugins**.

            ### Platform Support
            - ✅ Linux x86_64
            - ✅ Windows x86_64
            - ✅ macOS (Universal)

            ### Requirements
            - Godot 4.2+

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}