name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'SConstruct'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache

jobs:
  build-debug:
    name: 🚧 Build ${{ matrix.platform }} (Debug)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: universal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: ${{ matrix.platform }}-${{ matrix.arch }}-debug-${{ hashFiles('godot-cpp/**') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-debug-

      - name: Build (Template Debug)
        env:
          SCONS_CACHE: ${{ env.SCONS_CACHE }}
        run: |
          scons platform=${{ matrix.platform }} target=template_debug arch=${{ matrix.arch }} -j2